[package]
name = "phantom-license"
version = "1.0.0"
edition = "2021"
description = "License validation and anti-tamper for Phantom"
license = "Proprietary"
build = "build.rs"

[dependencies]
sha2 = "0.11"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
