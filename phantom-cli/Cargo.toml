[package]
name = "phantom-cli"
version = "1.0.0"
edition = "2021"
description = "Hardware identity privacy tool"
license = "Proprietary"
readme = "../README.md"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
phantom-ipc = { path = "../phantom-ipc" }
phantom-license = { path = "../phantom-license" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
