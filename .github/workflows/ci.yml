name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The README drawings are rendered from docs/art/phantom.art.json, so they rot
  # like any other derived file: a rule moves, nobody re-renders, and the picture
  # describes something that stopped being true. This re-renders every drawing,
  # compares the result against what is committed, and checks that each one fits
  # the columns it is drawn in.
  # Whether a drawing is TRUE of the code is a separate question, answered by
  # phantom-cli/tests/repo_art.rs in the test job.
  repo-art:
    name: repo art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_repo_art.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings are surfaced but do not fail the build — driver/DXE
      # bindings intentionally include placeholder code that will be
      # exercised only in Windows integration builds.
      - run: cargo clippy --workspace --all-targets

  # Fast Windows-target check on a Linux runner catches the class of
  # Windows-only compile errors we've been shipping (missing imports,
  # wrong trait bounds under #[cfg(windows)]) in ~1 minute instead of
  # waiting on the full Windows CI matrix. Cheaper than a Windows
  # runner minute; runs on every push.
  windows-crosscheck:
    name: cargo check (windows target on linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target x86_64-pc-windows-gnu

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose

  release-build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # build.rs refuses a release build without a seed. This job only
    # proves the release profile COMPILES, so feed it a fixed throwaway
    # seed. These binaries are never shipped; the real release build in
    # release.yml injects the production seed from an org secret.
    env:
      PHANTOM_MASTER_SEED: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
        continue-on-error: true

  # Build the Linux packages from debug binaries and sanity-check them, so a
  # broken build-packages.sh, control file, or spec is caught on every push
  # instead of only at release-tag time. Debug binaries are enough here: this
  # checks package structure, not the shipped binary, so no master seed is
  # needed.
  package-linux:
    name: package (linux smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        run: cargo build -p phantom-cli -p phantom-svc
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build packages
        run: bash packaging/linux/build-packages.sh v0.0.0-ci target/debug out
      - name: Sanity-check the artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -l out
          deb=$(ls out/*.deb); rpm=$(ls out/*.rpm); tar=$(ls out/*.tar.gz)
          # Capture first, then match with here-strings. Piping into `grep -q`
          # would SIGPIPE the producer and trip `pipefail`.
          dpkg-deb -I "$deb" >/dev/null
          deb_files=$(dpkg-deb -c "$deb")
          grep -q ' ./usr/sbin/phantom-svc$' <<<"$deb_files"
          grep -q ' ./lib/systemd/system/phantom.service$' <<<"$deb_files"
          rpm_scripts=$(rpm -qp --scripts "$rpm")
          grep -q 'preuninstall scriptlet' <<<"$rpm_scripts"
          rpm_files=$(rpm -qp -l "$rpm")
          grep -qx '/usr/bin/phantom' <<<"$rpm_files"
          tar_list=$(tar -tzf "$tar")
          grep -q '/install.sh$' <<<"$tar_list"
          echo "package smoke check passed"

  # Run the real apply / validate / revert path as root, isolated in a mount +
  # UTS namespace so the runner's own identity is never touched. This covers the
  # machine-id and hostname writes, the backup round-trip, and the consistency
  # check that unit tests cannot reach. MAC spoofing needs a physical NIC and is
  # verified in the VM dogfood, not here.
  linux-apply-integration:
    name: linux apply (rootful integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build phantom-cli
        run: cargo build -p phantom-cli
      - name: Apply, validate, and revert in a namespace
        run: sudo bash scripts/linux-apply-integration.sh target/debug/phantom-cli

  # Compile the Layer 1 kernel driver (phantom-driver) with the WDK, delivered
  # via NuGet so the build is pinned and reproducible. The driver is not shipped
  # (it is unsigned and not yet functional end to end), but compiling it at
  # Level4 with warnings-as-errors catches real bugs that no Rust test can reach.
  # The runner supplies the driver platform toolset and the Spectre-mitigated
  # libraries; NuGet supplies the WDK and SDK content.
  driver-build:
    name: driver build (WDK)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      # Build against the runner's preinstalled WDK (windows-2022 ships WDK 22H2
      # with the driver toolset and Spectre-mitigated libraries), which keeps the
      # build task assemblies in step with the runner's Visual Studio. The pinned
      # WDK NuGet packages (packages.config, Directory.Build.props) are for
      # reproducible local builds; they stay inert here because nothing restores
      # them, so Directory.Build.props imports evaluate to false.
      # Build the Link target, which compiles every source at Level4 with
      # warnings-as-errors and links phantom.sys. It stops before the INF
      # stamping, catalog, verification, and test-signing steps, which are driver
      # packaging for shipping, not code verification, and which depend on WDK
      # tooling that is flaky on the hosted runner. The goal here is to prove the
      # kernel C compiles and links. Packaging and signing are the deferred
      # Partner Center path (docs/windows-driver-signing.md).
      - name: Compile and link the driver (Release x64)
        run: msbuild phantom-driver\phantom.vcxproj /t:Link /p:Configuration=Release /p:Platform=x64 /nologo
