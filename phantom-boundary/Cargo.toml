[package]
name = "phantom-boundary"
version = "0.1.0"
edition = "2021"
description = "Local disclosure-boundary gateway policy and receipts for Phantom"
license = "Proprietary"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
hmac = "0.12"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["timeout"] }
url = "2"

[dev-dependencies]
tempfile = "3"
