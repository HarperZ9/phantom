name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release (e.g. v0.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Resolve the release version from either trigger: tag push uses
  # github.ref_name; workflow_dispatch uses the supplied input.
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            bin_ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            bin_ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Master signing seed for the license crate. Must be a
      # 64-hex-char organization secret. If absent, the crate's
      # build.rs fails the release build with a clear error —
      # release binaries MUST NOT ship with the DEV placeholder.
      - name: Build release binaries
        env:
          PHANTOM_MASTER_SEED: ${{ secrets.PHANTOM_MASTER_SEED }}
        run: cargo build --release --workspace --target ${{ matrix.target }}
      # phantom-verify is deliberately NOT shipped in the public
      # release archive — it's the vendor's investigation tool and
      # carries the same master-key material as phantom-cli, so
      # widening its distribution widens the reverse-engineering
      # surface without helping any end user.
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/phantom-cli dist/phantom
          cp target/${{ matrix.target }}/release/phantom-svc dist/
          cp LICENSE README.md CHANGELOG.md dist/
          tar -czf phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz -C dist .
      # Sign the raw Windows PE binaries BEFORE packaging them into
      # the zip and BEFORE the MSI wraps them. The MSI carries the
      # signed exes inside its cab, and the MSI itself is signed
      # separately below. sign.cmd no-ops (exit 0) when
      # PHANTOM_SIGNING_CERT_B64 is unset, so dev / PR runs still
      # produce a usable-but-unsigned build.
      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest'
        env:
          PHANTOM_SIGNING_CERT_B64: ${{ secrets.PHANTOM_SIGNING_CERT_B64 }}
          PHANTOM_SIGNING_CERT_PASS: ${{ secrets.PHANTOM_SIGNING_CERT_PASS }}
        shell: cmd
        run: |
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-cli.exe || exit /b 1
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-svc.exe || exit /b 1
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-tray.exe || exit /b 1
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/phantom-cli.exe dist/phantom.exe
          Copy-Item target/${{ matrix.target }}/release/phantom-svc.exe dist/
          if (Test-Path target/${{ matrix.target }}/release/phantom-tray.exe) {
            Copy-Item target/${{ matrix.target }}/release/phantom-tray.exe dist/
          }
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Copy-Item CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.zip
      # WiX v3 is preinstalled on windows-latest images, but its
      # path (C:\Program Files (x86)\WiX Toolset v3.14\bin) is not on
      # PATH by default. Add it, then build the MSI via build.cmd.
      # The MSI's ProductVersion in the .wxs must match
      # PHANTOM_MSI_VERSION so the output filename tracks the tag.
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PHANTOM_MSI_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $wixCandidates = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          $wixBin = $wixCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = $wixCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw 'WiX Toolset v3 not found after install' }
          $env:PATH = "$wixBin;$env:PATH"
          # Strip a leading 'v' from a tag-shaped version so the WiX
          # ProductVersion (must be N.N.N) accepts it.
          $env:PHANTOM_MSI_VERSION = $env:PHANTOM_MSI_VERSION -replace '^v', ''
          Push-Location phantom-installer
          cmd /c build.cmd
          Pop-Location
      - name: Sign MSI (Windows)
        if: matrix.os == 'windows-latest'
        env:
          PHANTOM_SIGNING_CERT_B64: ${{ secrets.PHANTOM_SIGNING_CERT_B64 }}
          PHANTOM_SIGNING_CERT_PASS: ${{ secrets.PHANTOM_SIGNING_CERT_PASS }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $msi = "phantom-installer/out/PhantomSetup-v$version.msi"
          if (-not (Test-Path $msi)) { throw "MSI not found at $msi" }
          cmd /c "phantom-installer\sign.cmd $msi"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-${{ matrix.target }}
          path: phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: phantom-msi
          path: phantom-installer/out/PhantomSetup-*.msi
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On workflow_dispatch there is no tag yet; the action
          # creates it against the current commit. On a tag-push
          # trigger the tag already exists and this is a no-op.
          tag_name: ${{ env.RELEASE_VERSION }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
