name: Release

on:
  push:
    # Matches v1.0.0 as well as prerelease tags like v1.0.0-rc1.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release (e.g. v1.0.0 or v1.0.0-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # Resolve the release version from either trigger: tag push uses
  # github.ref_name; workflow_dispatch uses the supplied input.
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            bin_ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            bin_ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Master signing seed for the license crate. Must be a
      # 64-hex-char organization secret. If absent, the crate's
      # build.rs fails the release build with a clear error —
      # release binaries MUST NOT ship with the DEV placeholder.
      - name: Build release binaries
        env:
          PHANTOM_MASTER_SEED: ${{ secrets.PHANTOM_MASTER_SEED }}
        run: cargo build --release --workspace --target ${{ matrix.target }}
      # phantom-verify is deliberately NOT shipped in the public
      # release archive — it's the vendor's investigation tool and
      # carries the same master-key material as phantom-cli, so
      # widening its distribution widens the reverse-engineering
      # surface without helping any end user.
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/phantom-cli dist/phantom
          cp target/${{ matrix.target }}/release/phantom-svc dist/
          cp LICENSE README.md CHANGELOG.md dist/
          tar -czf phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz -C dist .
      # Sign the raw Windows PE binaries BEFORE packaging them into
      # the zip and BEFORE the MSI wraps them. The MSI carries the
      # signed exes inside its cab, and the MSI itself is signed
      # separately below. sign.cmd no-ops (exit 0) when
      # PHANTOM_SIGNING_CERT_B64 is unset, so dev / PR runs still
      # produce a usable-but-unsigned build.
      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest'
        env:
          PHANTOM_SIGNING_CERT_B64: ${{ secrets.PHANTOM_SIGNING_CERT_B64 }}
          PHANTOM_SIGNING_CERT_PASS: ${{ secrets.PHANTOM_SIGNING_CERT_PASS }}
        shell: cmd
        run: |
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-cli.exe || exit /b 1
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-svc.exe || exit /b 1
          call phantom-installer\sign.cmd target\${{ matrix.target }}\release\phantom-tray.exe || exit /b 1
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/phantom-cli.exe dist/phantom.exe
          Copy-Item target/${{ matrix.target }}/release/phantom-svc.exe dist/
          if (Test-Path target/${{ matrix.target }}/release/phantom-tray.exe) {
            Copy-Item target/${{ matrix.target }}/release/phantom-tray.exe dist/
          }
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Copy-Item CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.zip
      # WiX v3 is preinstalled on windows-latest images, but its
      # path (C:\Program Files (x86)\WiX Toolset v3.14\bin) is not on
      # PATH by default. Add it, then build the MSI via build.cmd.
      # The MSI's ProductVersion in the .wxs must match
      # PHANTOM_MSI_VERSION so the output filename tracks the tag.
      # WiX v3 is preinstalled on windows-latest images but not on
      # PATH by default. Locate it, add it, then build the MSI.
      #
      # MSI ProductVersion must be numeric (N.N.N or N.N.N.N); it
      # cannot carry a SemVer prerelease suffix. So for a tag like
      # v1.0.0-rc1 we take:
      #   - filename version: "1.0.0-rc1"   (kept for artifact name)
      #   - MSI  ProductVersion: "1.0.0"    (stripped for candle)
      # Two rc MSIs of the same base version therefore share a
      # ProductVersion — that's fine: MajorUpgrade replaces them,
      # and every rc anyway targets throwaway VMs.
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $wixCandidates = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          $wixBin = $wixCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = $wixCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw 'WiX Toolset v3 not found after install' }
          $env:PATH = "$wixBin;$env:PATH"
          $filenameVersion = $env:RELEASE_VERSION -replace '^v', ''
          $productVersion = ($filenameVersion -split '-')[0]
          # build.cmd names the MSI PhantomSetup-v${PHANTOM_MSI_VERSION}.msi
          # and passes it to candle as -dProductVersion.
          # We want the filename to carry the full tag (rc1 included)
          # but the internal ProductVersion to be numeric-only, so we
          # override just the -d value after build.cmd would compute it.
          $env:PHANTOM_MSI_VERSION = $filenameVersion
          Push-Location phantom-installer
          # Invoke candle+light directly here to feed both values
          # separately; build.cmd is still the source of truth for
          # local dev, where filename == ProductVersion is fine.
          if (-not (Test-Path out)) { New-Item -ItemType Directory out | Out-Null }
          $buildDir = "..\target\${{ matrix.target }}\release"
          candle.exe -nologo -ext WixUtilExtension -ext WixUIExtension -arch x64 `
            -dProductVersion="$productVersion" `
            -dBuildDir="$buildDir" `
            -out "out\phantom.wixobj" phantom.wxs
          if ($LASTEXITCODE -ne 0) { throw 'candle failed' }
          light.exe -nologo -ext WixUtilExtension -ext WixUIExtension -cultures:en-us `
            -out "out\PhantomSetup-v$filenameVersion.msi" `
            "out\phantom.wixobj"
          if ($LASTEXITCODE -ne 0) { throw 'light failed' }
          Pop-Location
      - name: Sign MSI (Windows)
        if: matrix.os == 'windows-latest'
        env:
          PHANTOM_SIGNING_CERT_B64: ${{ secrets.PHANTOM_SIGNING_CERT_B64 }}
          PHANTOM_SIGNING_CERT_PASS: ${{ secrets.PHANTOM_SIGNING_CERT_PASS }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $msi = "phantom-installer/out/PhantomSetup-v$version.msi"
          if (-not (Test-Path $msi)) { throw "MSI not found at $msi" }
          cmd /c "phantom-installer\sign.cmd $msi"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-${{ matrix.target }}
          path: phantom-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: phantom-msi
          path: phantom-installer/out/PhantomSetup-*.msi
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Compute SHA-256 over every artifact so users on any platform
      # can verify their download. `sha256sum -c SHA256SUMS.txt` reads
      # this file when placed next to the artifacts. GPG signing of
      # this manifest lands with Sprint 23 (maintainer key + agent);
      # for now the file itself is enough to catch a corrupted
      # download or a swapped-artifact tamper.
      - name: Compute SHA256SUMS
        working-directory: artifacts
        run: |
          # Deterministic sort so the file diffs cleanly across releases.
          sha256sum $(ls | grep -v SHA256SUMS | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Auto-detect prerelease from the tag ("-rc", "-beta", "-alpha")
      # so we don't have to remember the flag on tag-push triggers.
      - name: Compute prerelease flag
        id: prerelease
        run: |
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ env.RELEASE_VERSION }}" =~ -(rc|beta|alpha) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On workflow_dispatch there is no tag yet; the action
          # creates it against the current commit. On a tag-push
          # trigger the tag already exists and this is a no-op.
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
